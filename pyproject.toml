[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carx-map-combiner"
version = "0.1.0"
description = "Local deterministic CarX map build orchestration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials==6.10.2"]

[project.gui-scripts]
mapcombiner-gui = "mapcombiner.gui:main"

[project.scripts]
mapcombiner = "mapcombiner.__main__:main"

[tool.setuptools.packages.find]
include = ["mapcombiner*"]
